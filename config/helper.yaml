namer:
  # Pfad zur namer.cfg
  # Docker: /etc/namer-helper/namer.cfg  (via config/helper/ Volume)
  # Proxmox LXC: /etc/namer/namer.cfg
  config_path: /etc/namer/namer.cfg
  # Verzeichnisse (werden aus namer.cfg gelesen falls leer)
  failed_dir: ""
  log_dir: ""

report:
  # Ausgabeverzeichnis für Reports
  output_dir: /var/lib/namer-helper/reports
  # Format: markdown, json, both
  format: both

stash:
  # URL der StashApp-Instanz (GraphQL-Endpoint wird automatisch ergänzt)
  # Beispiel Proxmox-LXC oder lokale Instanz:
  #   url: http://192.168.1.123:9999
  url: http://localhost:9999

  # API-Key (falls in StashApp unter Settings → Security gesetzt)
  # WICHTIG: Keinen echten API-Key hier eintragen — diese Datei ist in git.
  # Lokale Overrides mit Credentials gehören nach config/helper/helper.local.yaml (gitignored).
  api_key: ""

  # Timeout in Sekunden
  timeout: 15

  # Stash Bridge aktivieren
  enabled: false

# ---------------------------------------------------------------------------
# HINWEIS: Ollama- und API-Keys werden NICHT aus dieser Datei gelesen.
# Das Web-Dashboard (namer-helper serve) liest diese Werte aus:
#   /etc/namer-helper/ai_config.json  (wird über /settings gespeichert)
#
# CLI-Befehle (analyze, stash-search) nutzen ihre --ollama-url / --model Flags.
#
# Diese Sektion ist Referenz für die empfohlenen Standardwerte:
# ---------------------------------------------------------------------------
ollama:
  # Empfohlene Variante: Ollama als eigener Proxmox-LXC
  # Installer: https://community-scripts.github.io/ProxmoxVE/scripts?id=ollama
  # Nach der Installation: im Web-Dashboard unter /settings eintragen.
  #
  # Docker Full-Stack (--profile ollama):
  #   base_url: http://ollama:11434
  #
  # Empfohlene Modelle:
  #   qwen2.5:3b    — beste JSON-Qualität, ~2 GB  (empfohlen)
  #   llama3        — gute Balance, ~4 GB
  #   mistral       — schnell, ~4 GB
  base_url: http://localhost:11434
  model: qwen2.5:3b
  timeout: 30
  enabled: false

privacy:
  # local-only    — nur Namer + lokale StashApp + lokales Ollama, keine externen Abfragen
  # query-external — externe StashDB/stash-box-Abfragen erlaubt, kein Upload
  # contribute    — externe Abfragen + optionales Zurückmelden von Fingerprints
  mode: local-only
