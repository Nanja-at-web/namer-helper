[project]
name = "namer-helper"
version = "0.1.0"
description = "Sidecar helper for Namer: log analysis, failed-match review, reporting."
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "requests>=2.32",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
namer-helper = "namer_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/namer_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
