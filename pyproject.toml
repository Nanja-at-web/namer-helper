[project]
name = "namer-helper"
version = "0.1.0"
description = "Sidecar helper for Namer: log analysis, failed-match review, reporting."
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "requests>=2.32",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]

# System-Binaries (nicht via pip installierbar — separat installieren):
#   ffmpeg    — Video-Hashing (pHash), OCR-Frame-Extraktion, Video-Info
#               Debian/Ubuntu: apt install ffmpeg
#               Proxmox LXC:  bereits im namer-install.sh enthalten
#
#   tesseract — OCR auf Video-Frames (extract_frame_text)
#               Debian/Ubuntu: apt install tesseract-ocr tesseract-ocr-deu
#               Optional: nur für Pre-Check OCR-Funktion benötigt
#
#   moondream — Ollama Vision-Modell für Studio-Logo-Erkennung (optional)
#               ollama pull moondream
#               Optional: Pre-Check läuft ohne es, Logo-Erkennung wird übersprungen

[project.optional-dependencies]
# Für zukünftige Embedding-Suche (MVP Phase 3):
# embed = ["chromadb>=0.4"]

[project.scripts]
namer-helper = "namer_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/namer_helper"]
# src/namer_helper/data/ (aliases.json) is included automatically because
# it lives inside the package tree. No extra include needed.

[tool.pytest.ini_options]
testpaths = ["tests"]
